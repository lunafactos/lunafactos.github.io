<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;background:#0e0c0d;color:#f4efe9;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;padding:48px 20px 32px}
  main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .hero{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;border-radius:20px;display:block}
  h1{font-size:28px;font-weight:600;margin-top:16px;letter-spacing:.5px}
  .bajada{font-size:16px;color:#cfc6bd;margin-top:6px}
  .pregunta{font-size:15px;color:#a89f97;margin:36px 0 14px;text-transform:uppercase;letter-spacing:2px}
  a.puerta{display:block;width:100%;text-decoration:none;color:#0e0c0d;background:#f4efe9;border-radius:16px;padding:20px 18px;margin-bottom:14px;text-align:left;position:relative}
  a.puerta.dos{background:transparent;color:#f4efe9;border:2px solid #f4efe9}
  .titulo{font-size:22px;font-weight:700;display:block}
  .detalle{font-size:14px;margin-top:4px;display:block;opacity:.75}
  .flecha{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:24px;font-weight:700}
  a.guia{margin-top:22px;color:#cfc6bd;font-size:14px}
</style>
</head>
<body>
<main>
  <img class="hero" src="../img/luna.jpg" alt="Luna">
  <h1>Luna</h1>
  <p class="bajada">Lo que no subo a Instagram 😏</p>

  <p class="pregunta">¿Desde dónde me mirás?</p>

  <a class="puerta" href="https://cafecito.app/lunafactos">
    <span class="titulo">🇦🇷 Argentina</span>
    <span class="flecha">→</span>
  </a>

  <a class="puerta dos" href="https://www.fanvue.com/lunafactos">
    <span class="titulo">🌎 Resto del mundo</span>
    <span class="flecha">→</span>
  </a>

  <a class="guia" href="https://lunafactos.github.io/">La guía de chamuyo →</a>
</main>
</body>
</html>
